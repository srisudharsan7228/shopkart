<header class="shop-header">
	<div class="header-inner">
		<a class="brand" routerLink="/products">ShopKart</a>

		<div class="header-actions">
			@if (authService.currentUser()) {
				<p class="user-pill">
					{{ authService.currentUser()?.username }} ({{ authService.currentUser()?.role }})
				</p>
				<button type="button" class="logout-btn" (click)="logout()">Logout</button>
			} @else {
				<a class="login-link" routerLink="/login">Login</a>
			}
		</div>
	</div>
</header>

<div class="layout-shell">
	<aside class="side-nav" aria-label="Side navigation">
		<a routerLink="/products">Products</a>
		@if (authService.isAdmin()) {
			<a routerLink="/products/add">Add Product</a>
		}
		<a href="#">Categories</a>
		<a href="#">Offers</a>
		<a href="#">Contact</a>
	</aside>

	<main class="page-content">
		<router-outlet />
	</main>
</div>
